[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --tb=short
markers =
    unit: fast tests with no hardware or model dependencies (default in CI)
    integration: tests that load MLX or FluidAudio (slow, machine-specific)
    mlx: requires parakeet-mlx and GPU/MLX runtime
    fluidaudio: requires built asr-sidecar binary and FluidAudio models
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
