# Voice Transcriber Configuration

# Parakeet ASR model to use (Apple Silicon / MLX flavor on Hugging Face)
# Popular options:
#   mlx-community/parakeet-tdt-0.6b-v3   - Recommended, fast and accurate
#   mlx-community/parakeet-tdt-0.6b-v2   - Older v2 weights
#   mlx-community/parakeet-rnnt-1.1b     - Larger RNN-T, higher accuracy
parakeet_model: "mlx-community/parakeet-tdt-0.6b-v3"

# Auto-paste transcription after copying to clipboard
auto_paste: true

# Audio beep feedback when starting/stopping recording
audio_feedback: true

# Volume attenuation during recording (reduces background music/audio interference)
attenuate_volume: true
# Percentage to reduce volume to during recording (default: 10%)
attenuation_percent: 10

# Hotkey configuration. Can be either:
#   - a pynput Key name as a string, e.g. 'alt_r', 'shift', 'ctrl', 'f13'
#   - a numeric VK code, e.g. 176 (macOS Fn-dictation key, if remapped)
# Run detect_key.py to find your key.
# On macOS Sequoia/Tahoe, the right-option dictation key reports as 'alt_r'.
hotkey_code: 'alt_r'

# Save a copy of each recorded WAV under ./debug_audio for troubleshooting
save_debug_audio: true

# Floating VU meter at the cursor while recording.
# Spawned as a sidecar subprocess (indicator.py). Non-activating, so it
# never steals focus and doesn't break auto-paste. Set to false to disable.
show_indicator: true

# Audio recording settings
# Note: Parakeet expects 16kHz mono audio
audio:
  sample_rate: 16000
  channels: 1
  chunk_size: 1024
