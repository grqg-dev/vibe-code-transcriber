# Voice Transcriber Configuration

# NVIDIA Parakeet ASR model to use (Hugging Face / NGC model name)
# Popular options:
#   nvidia/parakeet-tdt-0.6b-v2     - Recommended, fast and accurate (English)
#   nvidia/parakeet-tdt_ctc-110m    - Smallest, fastest
#   nvidia/parakeet-rnnt-1.1b       - Largest RNN-T, highest accuracy
#   nvidia/parakeet-ctc-1.1b        - Largest CTC variant
parakeet_model: "nvidia/parakeet-tdt-0.6b-v2"

# Auto-paste transcription after copying to clipboard
auto_paste: true

# Audio beep feedback when starting/stopping recording
audio_feedback: true

# Volume attenuation during recording (reduces background music/audio interference)
attenuate_volume: true
# Percentage to reduce volume to during recording (default: 10%)
attenuation_percent: 10

# Hotkey configuration (advanced users only)
# Default: 176 (macOS dictation key)
# Run detect_key.py to find custom key codes
hotkey_code: 176

# Audio recording settings
# Note: Parakeet expects 16kHz mono audio
audio:
  sample_rate: 16000
  channels: 1
  chunk_size: 1024
